# Buka panel bank klan lalu cari nick member.
# WAJIB dikalibrasi: jalankan `lmbot record`, ukur tombol dengan
# `tools/crop.py`, lalu ganti angka fraksi di bawah (docs/CALIBRATION.md).
name: bank_open_member
description: buka panel bank klan dan cari nick member
enabled: false
steps:
  - assert: guild_menu          # dilewati otomatis bila template belum ada
  - tap: [0.300, 0.860]         # tombol Bank di menu klan
  - wait: 1.0
  - assert: bank_panel
  - tap: [0.500, 0.120]         # kolom pencarian member
  - wait: 0.4
  - type: "{nick}"
  - wait: 1.0
  - tap: [0.500, 0.250]         # baris hasil pertama
  - wait: 1.0

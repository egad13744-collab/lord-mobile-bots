name: CI (fallback tanpa OpenCV)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  nocv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependensi inti saja
        run: |
          python -m pip install -U pip
          python -m pip install PyYAML pytest pillow
      - name: Pastikan OpenCV benar-benar tidak ada
        run: python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('cv2') is None else 1)"
      - name: Test dengan fallback murni Python
        run: python -m pytest -q
      - name: Verifikasi template memakai fallback
        run: |
          python - <<'PY'
          from lmbot.imaging import Image, encode_png, make_template, verify_template
          from pathlib import Path
          import tempfile
          tmp = Path(tempfile.mkdtemp())
          W, H = 240, 120
          px = bytearray(W * H * 3)
          for y in range(70, 100):
              for x in range(150, 210):
                  o = (y * W + x) * 3
                  px[o:o+3] = b"\x14\xdc\x78"
          screen = tmp / "s.png"
          screen.write_bytes(encode_png(Image(W, H, 3, bytes(px))))
          make_template(screen, "send_button", [150, 70, 60, 30], tmp / "tpl")
          res = verify_template(screen, "send_button", tmp / "tpl")
          print(res)
          assert res["found"], res
          PY

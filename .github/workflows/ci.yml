name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (tanpa OpenCV dulu — uji fallback murni Python)
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Lint (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes lmbot tests code.py tools/crop.py
      - name: Test
        run: python -m pytest -q
      - name: Smoke test CLI (dry-run, tanpa emulator)
        run: |
          python code.py --dry-run cmd "!bal"
          python code.py --dry-run serve --once "!help"
          python code.py template list
